<!DOCTYPE html>
<meta charset="utf-8">
<title>Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#0b0e21;--bg2:#101432;--panel:#181e47;--panel2:#222a5e;--ink:#eef6ff;--mut:#aab1df;--line:#313c84;
  --teal:#ff5ca8;--lime:#7dffb3;--orange:#ffb86b;--mag:#bc6cff;--vio:#00f0ff;--err:#ff5d73;--ok:#3dffa0;
  --tile:#ffffff;--tileink:#141a3f;--glow:0 0 18px;
  --font:'atkinson hyperlegible',system-ui,-apple-system,'segoe ui',roboto,arial,sans-serif;
  --disp:'bricolage grotesque','atkinson hyperlegible',system-ui,sans-serif;
  --mono:'ibm plex mono',ui-monospace,menlo,consolas,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(900px 500px at 8% -10%,#222f8755,transparent 60%),radial-gradient(800px 500px at 100% 110%,#7a1b6a44,transparent 60%),var(--bg);
  color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
button,select,input,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
b{font-weight:700}
#app{height:100%;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;padding-block:8px}
/* header */
#hdr{grid-row:1;display:flex;gap:10px;align-items:center;min-width:0}
.brand{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--teal);box-shadow:var(--glow) var(--teal)}
.brand span{background:linear-gradient(90deg,var(--teal),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
#steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
#steps::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#141a3f;color:var(--mut);font-size:14px;white-space:nowrap}
.chip i{font-style:normal;font-family:var(--mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.chip.done{color:var(--ink);cursor:pointer;border-color:#5261c5}.chip.done i{background:var(--teal);color:#090e2d;border-color:var(--teal)}
.chip.cur{background:linear-gradient(90deg,var(--teal),var(--lime));color:#090e2d;border-color:transparent;font-weight:700;box-shadow:var(--glow) #ff5ca855}
.chip.cur i{background:#090e2d;color:var(--teal);border-color:transparent}
#dev{grid-row:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 10px;border:2px dashed var(--orange);border-radius:12px;background:#1d1a10;font-size:14px}
#dev select{min-height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px 6px}
/* stage */
#stage{grid-row:3;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}
#stage.full{grid-template-rows:minmax(0,1fr)}
.todo{display:flex;align-items:center;gap:14px;padding:8px 14px;border-radius:16px;background:linear-gradient(90deg,#1c2664,#171f54);border:2px solid var(--teal);box-shadow:var(--glow) #ff5ca833;animation:gentle 2.5s ease-in-out infinite}
@keyframes gentle{0%,100%{box-shadow:0 0 4px #ff5ca822;border-color:#ff5ca866;filter:brightness(.8)}50%{box-shadow:0 0 36px 8px #ff5ca8bb,inset 0 0 26px #ff5ca855;border-color:#7dffb3;filter:brightness(1.3)}}
.todo .tx b{animation:keyw 2.5s ease-in-out infinite}@keyframes keyw{0%,100%{color:var(--lime);text-shadow:none}50%{color:#fff;text-shadow:0 0 12px #7dffb3}}
.todo .tl{animation:tlp 2.5s ease-in-out infinite}
@keyframes tlp{0%,100%{opacity:.85}50%{opacity:1;box-shadow:0 0 12px #7dffb3}}
.todo .tl{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.14em;color:#090e2d;background:var(--lime);border-radius:8px;padding:5px 10px;flex:0 0 auto}
.todo .tx{flex:1;min-width:0;font-size:19px;line-height:1.25}
.todo .tx b{color:var(--lime)}
.todo .tp{flex:0 0 120px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--mut)}
.todo .tp .bar{height:8px;border-radius:99px;background:#0d112b;margin-top:4px;overflow:hidden}
.todo .tp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime));border-radius:99px;transition:width .3s}
.bench{display:grid;grid-template-columns:minmax(140px,190px) minmax(0,1fr) minmax(190px,250px);gap:10px;min-height:0}
.bench.c2{grid-template-columns:minmax(0,1fr) minmax(220px,300px)}
.bench.c1{grid-template-columns:minmax(0,1fr)}
.pn{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:10px;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px;overflow:hidden;position:relative}
.pn.t1{border-top:3px solid var(--teal)}.pn.t2{border-top:3px solid var(--orange)}.pn.t3{border-top:3px solid var(--mag)}.pn.t4{border-top:3px solid var(--vio)}.pn.t5{border-top:3px solid var(--lime)}
.pn h2{margin:0;font-family:var(--disp);font-size:16px;letter-spacing:.02em}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.tile{background:var(--tile);color:var(--tileink);border-radius:16px;border:3px solid var(--teal);box-shadow:0 0 16px #ff5ca855}.tile .xt{flex:1;min-height:0;width:100%;object-fit:contain;mix-blend-mode:multiply}
/* shelf */
.shelf{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:8px;flex:1;min-height:0}
.it{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px;border-radius:12px;background:var(--tile);color:var(--tileink);font-weight:700;font-size:12px;line-height:1.1;text-align:center;border:3px solid transparent;cursor:grab;min-height:0;min-width:0;touch-action:none;user-select:none;-webkit-user-select:none}
.it img{flex:1;min-height:0;width:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none}
.it.held{border-color:var(--lime);transform:scale(1.06);animation:liftp 1.4s ease-in-out infinite;box-shadow:0 0 0 3px #7dffb355,0 10px 22px #000a,var(--glow) #7dffb3aa}
@keyframes liftp{0%,100%{box-shadow:0 0 0 3px #7dffb355,0 10px 22px #000a,0 0 10px #7dffb388}50%{box-shadow:0 0 0 4px #7dffb399,0 12px 24px #000a,0 0 26px #7dffb3}}
.it.blk{opacity:.78}.it.blk::after{content:"✕";position:absolute;top:2px;right:6px;color:#e11d48;font-size:14px}
.it{position:relative}
.it.gone{opacity:.28;filter:grayscale(1)}
.ghost{position:fixed;z-index:50;pointer-events:none;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:14px;background:var(--tile);padding:6px;box-shadow:0 10px 30px #000a,var(--glow) var(--lime);opacity:.96}
.ghost img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.over{outline:3px dashed var(--lime);outline-offset:-3px;background-color:#7dffb314}
.drop{border-radius:14px}
/* work area */
.work{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.work>.tile{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.work img.fill{max-height:100%;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
.hintbadge{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:99px;background:#141a3fcc;color:#fff;font-size:13px;font-weight:700;z-index:3}
.cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:700;font-size:14px;color:#141a3f}
.stagedots{display:flex;gap:6px}
.sd{flex:1;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:#141a3f;color:var(--mut);font-size:13px;font-weight:700;text-align:center;cursor:pointer}
.sd.on{background:var(--panel2);color:var(--ink);border-color:var(--teal)}
.sd.ok::after{content:" ✓";color:var(--ok)}
/* buttons */
.btn{min-height:42px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;color:var(--ink)}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:linear-gradient(90deg,var(--teal),var(--lime));color:#090e2d;border-color:transparent;box-shadow:var(--glow) #ff5ca855}
.btn.hot{background:linear-gradient(90deg,var(--orange),var(--mag));color:#fff;border-color:transparent}
.btn.dis{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn.on{outline:3px solid var(--lime)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{font-family:var(--mono);font-size:13px;color:var(--mut);margin:0}
.big{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--teal)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:#141a3f;font-size:13px}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.tools{overflow:auto}
.tools .btn{width:100%}
.bigbtn{min-height:56px;font-size:17px}
/* footer */
#bar{grid-row:4;display:flex;gap:10px;align-items:center;min-height:50px}
#msg{flex:1;min-width:0;font-size:16px;color:var(--mut);padding:8px 12px;border-radius:12px;background:#101432;border:1px solid var(--line);min-height:44px;display:flex;align-items:center}
#msg.bad{color:#fff;background:#4a1020;border-color:var(--err);font-weight:700}
#msg.flash{animation:shk .45s}
@keyframes shk{0%,100%{transform:translatex(0)}20%{transform:translatex(-6px)}40%{transform:translatex(6px)}60%{transform:translatex(-4px)}80%{transform:translatex(3px)}}
#msg.good{color:var(--ok);border-color:var(--ok)}
/* welcome */
.welcome{grid-template-rows:minmax(0,1fr);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:center;max-width:1100px;margin:auto;height:100%;min-height:0}
.welcome .pic{border-radius:24px;overflow:hidden;box-shadow:var(--glow) #ff5ca855;border:3px solid var(--teal);max-height:100%;display:flex;background:#fff}
.welcome .pic img{width:100%;max-height:100%;object-fit:cover}
.welcome h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,4.2vw,52px);line-height:1.02;margin:6px 0 10px}
.welcome h1 span{background:linear-gradient(90deg,var(--lime),var(--teal),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{margin:0 0 10px;font-size:17px}
.sub{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--teal);text-transform:uppercase}
/* safety */
.bench.safe{grid-template-columns:minmax(190px,250px) minmax(0,1fr) minmax(0,1.3fr)}
.fig{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;border-radius:14px;background:#fff;position:relative}
.fig img{max-height:100%;max-width:100%;object-fit:contain}
.ppe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ppe .it{height:76px;font-size:11px;cursor:grab}
.ppe .it img{height:44px;flex:0 0 auto}
.field{display:flex;flex-direction:column;gap:3px}
.field input,.field select{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:#101432}
.pl{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:12px;border:1px solid var(--line);background:#141a3f;cursor:pointer;font-size:14px;line-height:1.25;text-align:left;width:100%}
.pl i{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-style:normal;color:transparent;font-weight:900}
.pl.on{border-color:var(--ok)}.pl.on i{background:var(--ok);border-color:var(--ok);color:#042b17}
.rem{margin:0;padding-left:18px;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.rem b{color:var(--ink)}
.hz{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:8px;flex:1;min-height:0}
.hc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;background:var(--tile);color:var(--tileink);border:4px solid transparent;cursor:pointer;padding:6px;font-weight:700;font-size:13px;text-align:center;line-height:1.15;min-height:0}
.hc img{flex:1;min-height:0;width:100%;object-fit:contain;mix-blend-mode:multiply}
.hc .ic{font-size:36px;line-height:1}
.hc.sel{border-color:var(--orange);box-shadow:var(--glow) #ffb86b88}
.hc.good{border-color:var(--ok)}.hc.bad{border-color:var(--err)}.hc.miss{border-color:var(--orange);animation:pls 1s infinite}
@keyframes pls{50%{box-shadow:var(--glow) #ffb86b}}
.hc small{font-weight:400;font-size:11px;color:#4c5698}
/* prediction */
.pred{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;min-height:0;height:100%}
.phot{display:flex;gap:10px;min-height:0;height:100%}
.pf{margin:0;position:relative;border:3px solid var(--teal);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 0 18px #ff5ca866,inset 0 0 0 2px #ffffff;min-width:0}
.pf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.pf figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 8px 9px;background:linear-gradient(transparent,#0b0e21d9);color:#fff;font-weight:700;font-size:15px;text-align:center}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.nums .btn{min-height:72px;font-size:22px;font-family:var(--disp)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cols .btn{display:flex;align-items:center;gap:8px;justify-content:center}
.sw{width:16px;height:16px;border-radius:5px;display:inline-block;flex:0 0 16px}
/* prepare */
.mort{position:relative;height:97%;max-width:97%;margin:auto}
.mort img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:fill;transition:opacity .7s ease,filter .7s ease;pointer-events:none}
.mort .m0{mix-blend-mode:multiply}
.mort .m3{transform-origin:55% 62%}
.mort .m3.grind{animation:grind .55s ease-in-out}
@keyframes grind{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(-9px,4px) rotate(-4deg)}45%{transform:translate(8px,-3px) rotate(3deg)}70%{transform:translate(-6px,3px) rotate(-2deg)}100%{transform:translate(0,0) rotate(0)}}
.lensbox{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#222a5e,#0e122d);border-radius:14px}
.lensbox svg{max-height:100%;max-width:100%;height:100%;touch-action:none}
.bk{position:relative;height:100%;aspect-ratio:1/1;max-width:100%}
.bk>*{position:absolute}
.bk .bimg{inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.bk .liq{background:linear-gradient(180deg,#9fe9ff99,#6fd0ee88);border-top:2px solid #ffffffcc;border-radius:0 0 7% 7%/0 0 4% 4%}
.bk .stripw{overflow:visible}
.bk .stripw svg{width:100%;height:100%;display:block;overflow:visible}
.bk .pcl{height:2.6%;filter:drop-shadow(0 1px 1px #0005)}
.bk .foil{object-fit:cover;clip-path:ellipse(50% 50% at 50% 50%);filter:drop-shadow(0 4px 5px #0007)}
.bk .anno{font-size:12px;font-weight:700;color:#0b4a5a;white-space:nowrap}
.pourpic{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pourpic img{max-height:88%;object-fit:contain}
/* run */
.clock{font-family:var(--mono);font-size:30px;color:var(--teal);text-shadow:var(--glow) #ff5ca8aa}
.qz{display:flex;flex-direction:column;gap:4px}.qz .opts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.qz p{margin:0;font-weight:700;font-size:14px}
.opt{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:10px;border:1px solid var(--line);background:#141a3f;cursor:pointer;min-height:36px;font-size:13px;line-height:1.15}
.opt.good{background:#0b3a2a;border-color:var(--ok)}.opt.badc{background:#3a1220;border-color:var(--err)}
.opt.sel{border-color:var(--lime);background:#27350a}
/* measure */
.cards{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(max-content,1fr);gap:8px;flex:1;min-height:0;overflow:auto}
.bench.m{grid-template-columns:minmax(210px,290px) minmax(200px,300px) minmax(0,1fr)}
@media (max-width:1150px) and (orientation:landscape){.bench.m{grid-template-columns:190px 210px minmax(0,1fr)}}
.bc{border:2px solid var(--line);border-radius:14px;background:#141a3f;padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-height:0}
.bc.sel{border-color:var(--teal);box-shadow:var(--glow) #ff5ca844}
.bc h3{margin:0;font-family:var(--disp);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.bc h3 .mk{font-size:12px;font-weight:400;color:var(--mut)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.bc label{font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;gap:1px}
.bc input,.bc select{min-height:32px;width:100%;border:1px solid var(--line);border-radius:8px;background:#101432;padding:2px 6px;font-family:var(--mono);font-size:14px}
.bc select{font-family:var(--font)}
.bc .v input,.bc .v select{border-color:var(--ok)}.bc .x input,.bc .x select{border-color:var(--err);background:#3a1220}
.calc{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;flex-wrap:wrap}
.calc .wk{color:var(--lime)}
.nbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nbox input[type=text],.nbox textarea{border:1px solid var(--line);border-radius:8px;background:#101432;padding:4px 8px}
.guidechips{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px}
.gc{padding:5px 7px;border-radius:9px;border:1px solid var(--line);display:flex;gap:6px;align-items:center;background:#141a3f;line-height:1.1}
.gc s{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
/* pack */
.bins{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr);gap:8px;flex:1;min-height:0}
.bn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:6px 6px 5px;border-radius:14px;background:var(--tile);color:var(--tileink);border:3px dashed #6a77c6;font-weight:700;font-size:12.5px;line-height:1.1;text-align:center;cursor:pointer;min-height:0;min-width:0}
.bn img{flex:1;min-height:0;width:100%;object-fit:contain;mix-blend-mode:multiply}
.bn.over{border-color:var(--lime)}
.bn.flashbad{animation:shk .4s;border-color:var(--err)}
.bn.flashok{border-color:var(--ok)}
.bn .cnt{position:absolute;top:4px;right:6px;background:#141a3f;color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.itemlist{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(84px,1fr);gap:7px;flex:1;min-height:0;overflow:auto}
.sink{border-radius:14px;overflow:hidden;background:var(--tile);flex:1;min-height:0;display:flex}
.sink img{width:100%;height:100%;object-fit:cover}
/* results */
.sum{width:100%;border-collapse:collapse;font-size:14px}
.sum th,.sum td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.sum th{background:var(--panel2);font-size:12px}
.scroll{overflow:auto}
.ok-box{padding:10px 12px;border-radius:12px;border:2px solid var(--ok);background:#0b3a2a}
.tip{font-size:13px;color:var(--mut)}
@media (pointer:coarse){.btn,.opt{min-height:46px}.btn.sm{min-height:44px}.bc input,.bc select{min-height:42px}}
@media (max-width:900px),(orientation:portrait){
  .pred{grid-template-columns:1fr}.phot{height:auto;min-height:320px}
  html,body{overflow:auto}

.qn{display:inline-block;background:linear-gradient(90deg,#bc6cff,#ff5ca8);color:#fff;border-radius:8px;padding:1px 8px;margin-right:4px;font-family:var(--mono)}
.ext{display:inline-block;font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:#7dffb3;color:#0b0e21}
.supbox{background:#00f0ff14;border:1px dashed #00f0ff88;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.35}
.growth{display:grid;gap:8px;padding:10px;border-radius:14px;background:#101432;border:1px solid var(--line)}
.gr{display:flex;align-items:center;gap:8px}.gr>b{min-width:80px}.gr .gb{min-width:34px;text-align:center;padding:4px 8px;border-radius:10px;background:#181e47;font:700 16px var(--mono)}
.gr .gb.up{background:linear-gradient(90deg,#7dffb3,#00f0ff);color:#0b0e21;animation:rpop .6s}
.gr em{font-style:normal;color:#7dffb3;font-weight:700}
@media (prefers-reduced-motion:reduce){.rp.on,.gr .gb.up{animation:none}}
.pgs{display:flex;align-items:center;gap:6px;margin-bottom:4px}.pgs i{width:26px;height:8px;border-radius:99px;background:#313c84}
.pgs i.d{background:#7dffb3}.pgs i.c{background:linear-gradient(90deg,#ff5ca8,#00f0ff);box-shadow:0 0 10px #00f0ff99}
.pgs span{margin-left:6px;font:700 12px var(--mono);color:var(--mut)}
#peekbox{position:fixed;inset:0;z-index:90;background:#000b;display:grid;place-items:center;padding:14px}
#peekbox .pkb{background:#181e47;border:2px solid #ff5ca8;border-radius:18px;padding:20px 24px;max-width:420px;display:grid;gap:10px;text-align:center;box-shadow:0 0 40px #ff5ca866}
#peekbox .pkt{display:flex;gap:14px;justify-content:center}#peekbox .pkt span{display:grid;gap:4px;font:700 12px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#peekbox .pkt b{font:700 34px var(--mono);color:#7dffb3;letter-spacing:0}#peekbox p{margin:0;font-size:14px}

.bench.safe.one{grid-template-columns:minmax(0,1fr)}
.bench.safe.one>.pn.t3{max-width:980px;width:100%;margin:0 auto}
.bench.hzp .hz{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(150px,1fr)}
.bench.hzp .hc img{object-fit:cover;border-radius:14px;mix-blend-mode:normal}
/* kit additions on top of the base CSS */
.ver{display:inline-block;margin-left:6px;font:500 11px var(--mono);opacity:.6}
.fig.lt,.it.lt{background:#f2f2f2}.fig.lt img,.it.lt img{mix-blend-mode:multiply}
.ppe .it.lt span{color:#141a3f}
.it.gone{opacity:.25;pointer-events:none}
.bench.qs .pn .pgs{margin:0}
@media (max-width:900px),(orientation:portrait){
 .bench{grid-template-columns:1fr!important}
 .bench>.pn{min-height:0}
 .bins2 .bn{min-height:150px}
 .itemlist{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))!important}
 .itemlist .it{height:190px}
 .bench .fig{min-height:260px}
 .bench.qs .pn .ta{min-height:160px}
}
/* kit 1.1: prediction option grid (text-only options allowed) */
.mkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));grid-auto-rows:minmax(0,1fr);gap:8px;flex:1;min-height:0;overflow:auto}
.mkc.on{border-color:var(--lime);box-shadow:0 0 0 3px #7dffb355,var(--glow) #7dffb3aa}
.mkc:not(:has(img)){justify-content:center;font-size:15px;padding:10px 12px;min-height:60px;border:3px solid var(--line);line-height:1.2}

/* question tags: MYP command term, DOK level and criterion band */
.cmd{display:inline-block;font:700 11px var(--mono);letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--lime);color:#0b0e21;vertical-align:middle;margin-left:6px;text-transform:uppercase}
.band{display:inline-block;font:700 11px var(--mono);color:var(--mut);vertical-align:middle;margin-left:6px}
.rq{margin:0 0 8px;padding:8px 10px;border-left:4px solid var(--lime);background:#ffffff14;border-radius:8px;font-size:15px}
/* ===== instrument blocks ===== */
.lk{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;border:1px solid #313c84;background:#101432;color:#eef6ff;font:700 15px var(--fd,inherit);cursor:pointer;text-align:left;min-height:46px}
.lk b{display:grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:99px;color:#fff;font:700 13px var(--mono);border:2px solid #fff}
.lk.on{border-color:#7dffb3;box-shadow:0 0 0 2px #7dffb355}
.kbscope{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,210px);gap:12px;flex:1;min-height:0;align-items:center}
.kbscope .eye{aspect-ratio:1;max-height:100%;max-width:100%;margin:0 auto;height:100%;border-radius:50%;overflow:hidden;background:#000;border:10px solid #070a18;box-shadow:0 0 0 3px #313c84,0 0 30px #000 inset;position:relative}
.kbscope .eye.sharp{box-shadow:0 0 0 3px #7dffb3,0 0 24px #7dffb366}
.kbscope .fld{position:absolute;inset:0;transition:transform .5s ease,filter .25s linear}.kbscope .fld img{width:100%;height:100%;object-fit:cover;display:block}
.kbscope .ctl{display:grid;gap:6px;align-content:center}
.objs{display:flex;gap:6px;flex-wrap:wrap}.objs .btn.on{background:linear-gradient(90deg,#ff5ca8,#00f0ff);color:#0b0e21;border-color:transparent}
.knob{display:grid;grid-template-columns:52px 1fr 52px;gap:6px;align-items:center;text-align:center}.knob span{font:700 18px var(--mono)}.knob .btn{min-height:46px;font-size:22px;padding:0}
.kbbath{display:grid;gap:8px;justify-items:center;flex:1;min-height:0}.kbbath svg{width:min(100%,300px);height:auto;min-height:0;flex:1}
.kbbath .rd{display:grid;justify-items:center;gap:2px}.kbbath .rd b{font:700 30px var(--mono);color:#7dffb3}
.kbbub{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr);gap:14px;flex:1;min-height:0}
.kbbub .tube{position:relative;border:4px solid #cfe6ff;border-top:0;border-radius:0 0 40px 40px;overflow:hidden;min-height:220px;background:#ffffff10}
.kbbub .liq{position:absolute;left:0;right:0;bottom:0;top:12%;background:linear-gradient(#f3e3a8aa,#d8b85aaa)}
.kbbub .bb{position:absolute;bottom:4%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bfe6ff 60%,#7fc4ff);box-shadow:0 0 6px #fff8;animation:kbrise 1.6s ease-in forwards}
@keyframes kbrise{to{transform:translateY(-240px) scale(1.25);opacity:.15}}
.kbbub .side{display:grid;gap:8px;align-content:center}.kbbub .big{font:700 46px var(--mono);color:#7dffb3;line-height:1}
.kbtbl input{width:100%;min-width:60px;min-height:40px;text-align:center}
.kbgraph{flex:1;min-height:0;display:grid;place-items:center;background:#fff;border-radius:12px;padding:6px}.kbgraph svg{width:100%;height:100%;max-height:100%;touch-action:manipulation;cursor:crosshair}
.kbgraph .gl{stroke:#d5d8e6;stroke-width:1}.kbgraph .gax{stroke:#141a3f;stroke-width:2}.kbgraph .gt{font:11px Arial,sans-serif;fill:#141a3f}.kbgraph .gt.b{font-weight:700;font-size:12px}
.kbgraph .gcol{stroke:#ff5ca8;stroke-width:1.5;stroke-dasharray:3 4;opacity:.5}.kbgraph .gcol.cur{opacity:1;stroke-width:3}
.kbgraph .gp line{stroke:#0b6a52;stroke-width:3;stroke-linecap:round}.kbgraph .gp.bad line{stroke:#e03131}.kbgraph .gline{fill:none;stroke:#1c7ed6;stroke-width:2.5}
.kbruler{display:grid;grid-template-columns:44px minmax(0,1fr) 52px;gap:6px;flex:1;min-height:0;align-items:stretch}
.kbruler .rul{position:relative;background:#ffe9a8;border-radius:6px;border:1px solid #b99a3a;margin:8px 0}
.kbruler .rul i{position:absolute;right:0;width:8px;height:1px;background:#3a2c00}.kbruler .rul i.m{width:14px}.kbruler .rul i.b{width:20px;height:2px}
.kbruler .rul em{position:absolute;right:22px;top:-7px;font:700 10px var(--mono);font-style:normal;color:#3a2c00}
.kbruler .obj{position:relative;margin:8px 0;border-radius:8px;overflow:visible;cursor:crosshair;background:#fff}
.kbruler .obj>svg,.kbruler .obj>img{position:absolute;inset:0;width:100%;height:100%}
.kbruler .mk{position:absolute;left:-8px;right:-8px;height:0;border-top:3px solid #bc6cff;box-shadow:0 0 8px #bc6cff;pointer-events:none}
.kbruler .mk span{position:absolute;right:6px;top:-26px;background:#bc6cff;color:#fff;font:700 13px var(--mono);border-radius:6px;padding:2px 6px;white-space:nowrap}
.kbruler .nud{display:grid;gap:8px;align-content:center}.kbruler .nud .btn{min-height:52px;padding:0}
@media (max-width:900px),(orientation:portrait){.kbscope{grid-template-columns:1fr}.kbscope .eye{height:auto;width:min(100%,420px)}.kbbub .tube{min-height:260px}.kbgraph{min-height:320px}.kbruler{min-height:420px}}
@media (prefers-reduced-motion:reduce){.kbbub .bb{animation-duration:.01s}.kbscope .fld{transition:none}}

.kbgraph .gp.s0 line{stroke:#0e9aa7}.kbgraph .gp.s0 circle{fill:#0e9aa7;stroke:#fff;stroke-width:1.5}.kbgraph .gline.s0{stroke:#0e9aa7}
.kbgraph .gp.s1 line{stroke:#e8590c}.kbgraph .gp.s1 circle{fill:#e8590c;stroke:#fff;stroke-width:1.5}.kbgraph .gline.s1{stroke:#e8590c}
.kbgraph .gp.bad line{stroke:#e03131!important}.kbgraph .gp.bad circle{fill:#e03131!important}
.gleg{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700}.gleg i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.gleg .l0 i{background:#0e9aa7;border-radius:3px}.gleg .l1 i{background:#e8590c;border-radius:50%}

:root{--err:#ff4d5e}

 <div class="ctl"><div class="lbl">Objective lens</div><div class="objs">${cfg.objs.map(o=>`<button class="btn sm ${sc.obj===o?'on':''}" data-a="kbobj" data-v="${o}">${o}×</button>`).join('')}</div>
 <div class="lbl">Coarse focus</div><div class="knob"><button class="btn" data-a="kbfocus" data-k="coarse" data-d="-2" aria-label="Coarse focus down">−</button><span id="kbco">${sc.coarse}</span><button class="btn" data-a="kbfocus" data-k="coarse" data-d="2" aria-label="Coarse focus up">+</button></div>
 <div class="lbl">Fine focus</div><div class="knob"><button class="btn" data-a="kbfocus" data-k="fine" data-d="-1" aria-label="Fine focus down">−</button><span id="kbfi">${sc.fine}</span><button class="btn" data-a="kbfocus" data-k="fine" data-d="1" aria-label="Fine focus up">+</button></div>
 <div class="stat" id="kbsharp">${sharp?'Sharp image ✓':'Image is blurred'}</div></div></div>`};
KB.scopePaint=(sc,c)=>{const cfg=KB.scopeCfg(c),f=$('#kbfld');if(f)f.style.cssText=KB.scopeStyle(sc,cfg);const a=$('#kbco'),b=$('#kbfi'),s=$('#kbsharp'),e=$('.kbscope .eye'),sh=KB.scopeSharp(sc,cfg);if(a)a.textContent=sc.coarse;if(b)b.textContent=sc.fine;if(s)s.textContent=sh?'Sharp image ✓':'Image is blurred';if(e)e.classList.toggle('sharp',sh)};
/* returns '' when fine, or the message to show with bad() */
KB.scopeAct=(a,d,sc,c)=>{const cfg=KB.scopeCfg(c);
 if(a==='kbobj'){const v=+d.v,i=cfg.objs.indexOf(v),j=cfg.objs.indexOf(sc.obj);if(v===sc.obj)return '';
  if(i>j+1)return `Go up one lens at a time. Use the ${cfg.objs[j+1]}× lens next.`;
  if(i>j&&!KB.scopeSharp(sc,cfg))return `Get a sharp image at ${sc.obj}× first.`;
  if(i>j){sc.coarse=Math.round(cfg.ideal[sc.obj]);sc.fine=Math.round((cfg.ideal[sc.obj]-sc.coarse)/.15)}   /* lenses are close to parfocal */
  sc.obj=v;sfx('tap');return ''}
 if(a==='kbfocus'){if(d.k==='coarse'){if(sc.obj===cfg.objs[cfg.objs.length-1])return `At ${sc.obj}× use the fine focus only. The coarse knob could push the lens into the slide.`;sc.coarse=kbClamp(sc.coarse+ +d.d,0,100)}else sc.fine=kbClamp(sc.fine+ +d.d,-30,30);
  sfx('tap');return ''}
 return null};
KB.totalMag=(sc,c)=>KB.scopeCfg(c).eyepiece*sc.obj;
/* ---------- 5. WATER BATH / ICE BATH with a thermometer ----------
   b: {target:null,temp:22}   cfg: {temps:[5,15,25,35,45], room:22, iceBelow:10} */
KB.bathCfg=c=>Object.assign({temps:[5,15,25,35,45],room:22,iceBelow:10,min:0,max:60},c);
KB.bathReady=b=>b.target!=null&&Math.abs(b.temp-b.target)<.5;
KB.bathIce=(b,c)=>b.target!=null&&b.target<=KB.bathCfg(c).iceBelow;
KB.bathHTML=(b,c)=>{const cfg=KB.bathCfg(c),ice=KB.bathIce(b,cfg),h=kbClamp((b.temp-cfg.min)/(cfg.max-cfg.min),0,1)*92;
 return `<div class="kbbath"><svg viewBox="0 0 220 190" aria-label="${ice?'Ice bath':'Water bath'} with a thermometer"><rect x="30" y="50" width="130" height="120" rx="10" fill="none" stroke="#cfe6ff" stroke-width="4"/><rect id="kbwat" x="34" y="78" width="122" height="88" rx="6" fill="${ice?'#8fd6ff':'#4aa8ff'}" opacity=".55"/>
 <g id="kbice" style="display:${ice?'':'none'}">${[[48,84],[82,80],[116,86],[62,104],[100,102],[132,108]].map(([x,y])=>`<rect x="${x}" y="${y}" width="20" height="18" rx="4" fill="#f2fbff" opacity=".9" stroke="#bfe6ff"/>`).join('')}</g>
 <rect x="182" y="20" width="14" height="130" rx="7" fill="#fff" stroke="#cfe6ff" stroke-width="2"/><rect id="kbmerc" x="186" y="${24+92-h}" width="6" height="${h+30}" rx="3" fill="#ff4f6d"/><circle cx="189" cy="158" r="12" fill="#ff4f6d" stroke="#cfe6ff" stroke-width="2"/></svg>
 <div class="rd"><span class="lbl">${ice?'Ice bath':'Water bath'}</span><b id="kbtemp">${b.temp.toFixed(1)} °C</b><span class="stat" id="kbbst">${b.target==null?'Choose a temperature.':KB.bathReady(b)?'Ready at '+b.target+' °C ✓':'Changing to '+b.target+' °C…'}</span></div>
 <div class="objs">${cfg.temps.map(t=>`<button class="btn sm ${b.target===t?'on':''}" data-a="kbbath" data-v="${t}">${t} °C</button>`).join('')}</div></div>`};
/* call from the step's tick(); returns true the moment the bath becomes ready */
KB.bathTick=(b,c)=>{if(b.target==null)return false;const was=KB.bathReady(b);if(!was){const d=b.target-b.temp;b.temp+=Math.sign(d)*Math.min(Math.abs(d),1.1)}
 const cfg=KB.bathCfg(c),t=$('#kbtemp'),m=$('#kbmerc'),s=$('#kbbst'),h=kbClamp((b.temp-cfg.min)/(cfg.max-cfg.min),0,1)*92;if(t)t.textContent=b.temp.toFixed(1)+' °C';if(m){m.setAttribute('y',24+92-h);m.setAttribute('height',h+30)}
 const rdy=KB.bathReady(b);if(s)s.textContent=rdy?'Ready at '+b.target+' °C ✓':'Changing to '+b.target+' °C…';return rdy&&!was};
/* ---------- 6. BUBBLE COUNTER: bubbles rise for a timed run; the student tallies them ----------
   u: {running:0,done:0,n:0,tally:0} */
KB.bubblesHTML=(u,o)=>{o=o||{};return `<div class="kbbub"><div class="tube" id="kbtube" aria-label="Tube with rising gas bubbles"><i class="liq"></i></div>
 <div class="side"><div class="lbl">${o.label||'Bubbles counted'}</div><b class="big" id="kbtally">${u.tally}</b>
 <button class="btn pri bigbtn" data-a="kbbubtap" ${u.running?'':'disabled'}>+1 bubble</button>
 <button class="btn" data-a="kbbubstart" ${u.running?'disabled':''}>${u.done?'Run again':(o.start||'Start 1 minute (sped up)')}</button>
 <div class="stat" id="kbbubst">${u.running?'Counting… tap +1 for every bubble.':u.done?'Run finished.':'Press start, then tap +1 for every bubble.'}</div></div></div>`};
KB.bubblesStart=(u,n,secs,onEnd)=>{u.running=1;u.done=0;u.n=n;u.tally=0;secs=secs||12;const times=[];for(let i=0;i<n;i++)times.push((i+.3+Math.random()*.5)/n*secs*1000);
 times.forEach(t=>setTimeout(()=>{const tb=$('#kbtube');if(!tb)return;const b=document.createElement('i');b.className='bb';b.style.left=(30+Math.random()*40)+'%';tb.appendChild(b);setTimeout(()=>b.remove(),1700)},t));
 setTimeout(()=>{u.running=0;u.done=1;onEnd&&onEnd()},secs*1000+1800)};
KB.bubblesTap=u=>{if(!u.running)return;u.tally++;sfx('tap');const t=$('#kbtally');if(t)t.textContent=u.tally};
KB.bubblesOK=(u,tol)=>u.done&&Math.abs(u.tally-u.n)<=(tol==null?1:tol);
/* ---------- 7. DATA TABLE: typed readings ----------
   cols: [{k:'t',label:'Temperature (°C)',ro:1},{k:'n',label:'Bubbles in 1 min'}]   rows: [{t:5},{t:15}] (ro columns are filled for the student)   vals: [{n:''},...] */
KB.tableHTML=(o)=>`<table class="tbl kbtbl"><tr>${o.cols.map(c=>`<th>${c.label}</th>`).join('')}</tr>${o.rows.map((r,i)=>`<tr>${o.cols.map(c=>c.ro?`<td><b>${esc(r[c.k])}</b></td>`:`<td><input inputmode="decimal" autocomplete="off" data-in="kbt.${o.key||'t'}.${i}.${c.k}" value="${esc((o.vals[i]||{})[c.k])}" aria-label="${c.label} row ${i+1}"></td>`).join('')}</tr>`).join('')}</table>`;
KB.tableInput=(k,v,vals,key)=>{const m=k.split('.');if(m[0]!=='kbt'||m[1]!==(key||'t'))return false;(vals[+m[2]]=vals[+m[2]]||{})[m[3]]=v;return true};
KB.num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
/* ---------- 8. GRAPH: students plot their own points by tapping the grid ----------
   g: {pts:{}} (x value -> y value)   cfg: {xs:[5,15,25,35,45], xLabel, yLabel, xmax:50, ymax:40, xstep:10, ystep:5, snap:1} */
KB.graphGeom={l:46,t:10,w:330,h:210};
KB.graphHTML=(g,cfg,o)=>{o=o||{};const G=KB.graphGeom,X=x=>G.l+x/cfg.xmax*G.w,Y=y=>G.t+G.h-y/cfg.ymax*G.h;let s='';
 for(let x=0;x<=cfg.xmax;x+=cfg.xstep)s+=`<line x1="${X(x)}" y1="${G.t}" x2="${X(x)}" y2="${G.t+G.h}" class="gl"/><text x="${X(x)}" y="${G.t+G.h+14}" class="gt" text-anchor="middle">${x}</text>`;
 for(let y=0;y<=cfg.ymax;y+=cfg.ystep)s+=`<line x1="${G.l}" y1="${Y(y)}" x2="${G.l+G.w}" y2="${Y(y)}" class="gl"/><text x="${G.l-6}" y="${Y(y)+4}" class="gt" text-anchor="end">${y}</text>`;
 const ser=(gg,o2,cls,mark)=>{const P=cfg.xs.filter(x=>gg.pts[x]!=null).map(x=>[x,gg.pts[x]]);let t='';
  if(o2.line&&P.length>1)t+=`<polyline points="${P.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" class="gline ${cls}"/>`;
  t+=P.map(p=>{const bd=o2.bad&&o2.bad.includes(p[0])?'bad':'',x=X(p[0]),y=Y(p[1]);
   return mark==='o'?`<g class="gp ${cls} ${bd}"><circle cx="${x}" cy="${y}" r="6.5"/></g>`:`<g class="gp ${cls} ${bd}"><line x1="${x-6}" y1="${y-6}" x2="${x+6}" y2="${y+6}"/><line x1="${x-6}" y1="${y+6}" x2="${x+6}" y2="${y-6}"/></g>`}).join('');return t};
 (o.others||[]).forEach(q=>{s+=ser(q.g,q,q.cls||'',q.mark)});
 s+=cfg.xs.map(x=>`<line x1="${X(x)}" y1="${G.t}" x2="${X(x)}" y2="${G.t+G.h}" class="gcol ${o.cur===x?'cur':''}"/>`).join('');
 s+=ser(g,o,o.cls||'',o.mark);
 return `<div class="kbgraph"><svg viewBox="0 0 ${G.l+G.w+12} ${G.t+G.h+44}" data-a="kbgraph" role="button" tabindex="0" aria-label="Graph grid. Tap to plot a point.">${s}<line x1="${G.l}" y1="${G.t}" x2="${G.l}" y2="${G.t+G.h}" class="gax"/><line x1="${G.l}" y1="${G.t+G.h}" x2="${G.l+G.w}" y2="${G.t+G.h}" class="gax"/>
 <text x="${G.l+G.w/2}" y="${G.t+G.h+36}" class="gt b" text-anchor="middle">${cfg.xLabel}</text><text transform="translate(12 ${G.t+G.h/2}) rotate(-90)" class="gt b" text-anchor="middle">${cfg.yLabel}</text></svg></div>`};
/* a tap snaps to the nearest x column and the nearest y snap value */
KB.graphTap=(e,el,g,cfg)=>{const G=KB.graphGeom,r=el.getBoundingClientRect(),vb=el.viewBox.baseVal,sx=(e.clientX-r.left)/r.width*vb.width,sy=(e.clientY-r.top)/r.height*vb.height;
 const xv=(sx-G.l)/G.w*cfg.xmax,yv=(G.t+G.h-sy)/G.h*cfg.ymax;if(yv<-cfg.ymax*.05||yv>cfg.ymax*1.05)return null;
 const x=cfg.xs.reduce((a,b)=>Math.abs(b-xv)<Math.abs(a-xv)?b:a);if(Math.abs(x-xv)>cfg.xstep*.45)return null;const sn=cfg.snap||1,y=kbClamp(Math.round(yv/sn)*sn,0,cfg.ymax);g.pts[x]=y;sfx('pop');return {x,y}};
KB.graphBad=(g,cfg,ys,tol)=>cfg.xs.filter((x,i)=>g.pts[x]==null||Math.abs(g.pts[x]-ys[i])>(tol==null?1:tol));
/* ---------- 9. RULER and Rf ----------
   r: {mm:0}   cfg: {len:100 (mm shown, 0 at the bottom), step:.5}   inner: HTML of the thing being measured (it fills the same box) */
KB.rulerHTML=(r,cfg,inner)=>{const L=cfg.len;let t='';for(let m=0;m<=L;m++){const y=100-m/L*100,big=m%10===0,mid=m%5===0;t+=`<i class="${big?'b':mid?'m':''}" style="top:${y}%">${big?`<em>${m}</em>`:''}</i>`}
 return `<div class="kbruler"><div class="rul" aria-hidden="true">${t}</div><div class="obj" data-a="kbruler" role="button" tabindex="0" aria-label="Tap to move the measuring line">${inner}<div class="mk" id="kbmk" style="top:${100-r.mm/L*100}%"><span id="kbmm">${r.mm.toFixed(1)} mm</span></div></div>
 <div class="nud"><button class="btn" data-a="kbnudge" data-d="${cfg.step||.5}" aria-label="Move line up">▲</button><button class="btn" data-a="kbnudge" data-d="${-(cfg.step||.5)}" aria-label="Move line down">▼</button></div></div>`};
KB.rulerPaint=(r,cfg)=>{const m=$('#kbmk'),s=$('#kbmm');if(m)m.style.top=(100-r.mm/cfg.len*100)+'%';if(s)s.textContent=r.mm.toFixed(1)+' mm'};
KB.rulerTap=(e,el,r,cfg)=>{const b=el.getBoundingClientRect(),st=cfg.step||.5;r.mm=kbClamp(Math.round((1-(e.clientY-b.top)/b.height)*cfg.len/st)*st,0,cfg.len);sfx('tap');KB.rulerPaint(r,cfg)};
KB.rulerNudge=(d,r,cfg)=>{r.mm=kbClamp(+(r.mm+ +d).toFixed(2),0,cfg.len);sfx('tap');KB.rulerPaint(r,cfg)};
KB.rf=(dist,front)=>{const d=KB.num(dist),f=KB.num(front);if(d==null||f==null||f<=0)return null;const v=d/f;return {v,text:`Rf = ${d} ÷ ${f} = ${v.toFixed(2)}`}};
KB.near=(v,target,tol)=>{const n=KB.num(v);if(n==null)return 'empty';return Math.abs(n-target)<=tol?'ok':n<target?'low':'high'};

</script>
