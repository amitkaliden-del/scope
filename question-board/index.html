:root{
  --ink:#04003b;--indigo:#180182;--violet:#5000bb;--mag:#e929fb;--pink:#ff2d8a;--blue:#29b6ff;
  --panel:rgba(4,0,59,.86);--line:rgba(255,255,255,.22);--txt:#fff;--mute:#cfc4ff;
  --spray:'Rubik Spray Paint','Permanent Marker',cursive;--mark:'Permanent Marker',cursive;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:var(--body);font-size:17px;
  -webkit-text-size-adjust:100%;touch-action:manipulation;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;min-width:44px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- moving brick wall ---------- */
.wall{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--ink)}
.wall-far{position:absolute;left:0;top:0;height:100%;width:calc(100% + 240px);
  background-image:var(--brick);background-size:240px 120px;background-repeat:repeat;
  animation:farmove 8s linear infinite;will-change:transform}
@keyframes farmove{from{transform:translateX(0)}to{transform:translateX(-240px)}}
.wall-near{position:absolute;left:0;top:0;height:100%;width:2800px;animation:nearmove 40s linear infinite;
  will-change:transform;opacity:.55;pointer-events:none}
@keyframes nearmove{from{transform:translateX(0)}to{transform:translateX(-1400px)}}
.tag{position:absolute;font-family:var(--spray);line-height:1;white-space:nowrap;text-shadow:0 0 14px currentColor}
.glow{position:absolute;border-radius:50%;filter:blur(26px)}
.wall-tint{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(4,0,59,.9) 0%,rgba(24,1,130,.72) 38%,rgba(80,0,187,.58) 72%,rgba(160,16,184,.62) 100%)}
body.still .wall-far,body.still .wall-near,body.asleep .wall-far,body.asleep .wall-near{animation-play-state:paused}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ---------- header, tabs ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:58px;background:var(--panel);border-bottom:2px solid var(--pink)}
.logo{font-family:var(--spray);font-size:26px;letter-spacing:1px;color:var(--mag);text-shadow:0 0 12px rgba(233,41,251,.7);white-space:nowrap}
.logo small{font-family:var(--mark);font-size:14px;color:var(--blue);text-shadow:none;margin-left:6px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);min-height:44px;background:rgba(255,255,255,.06)}
.chip b{font-family:var(--mark);font-weight:400;color:#04003b;background:var(--c,#fff);border-radius:6px;padding:0 8px;font-size:18px}
.btn{border:2px solid var(--blue);background:transparent;border-radius:12px;padding:6px 14px;font-weight:700}
.btn:hover{background:rgba(41,182,255,.18)}
.btn.pri{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.pri:hover{background:#ff5aa5}
.btn.ok{background:#2fd47a;border-color:#2fd47a;color:#04003b}

.compose{background:var(--panel);border-top:2px solid var(--pink);padding:8px 12px;display:flex;flex-direction:column;gap:4px}

/* ---------- login/setup ---------- */

/* ---------- teacher ---------- */
.flist{display:flex;flex-direction:column;gap:12px;max-width:900px;margin:0 auto}

/* short screens */

<body>
<div class="wall" aria-hidden="true"><div class="wall-far"></div><div class="wall-near" id="near"></div><div class="wall-tint"></div></div>
<div id="app"></div>
<div id="sleep"><button data-act="wake" aria-label="Wake the board"><span class="big">Board sleeping</span><span class="sub">Tap to reconnect</span></button></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div>
<div id="net" role="status"></div>
<div id="toast" role="status"></div>
<div id="print"></div>
<script>
(()=>{
'use strict';
/* =====================================================================
   CONFIG
   ===================================================================== */
const CLASSES=['A','B','C','D','E','F','G','H'];
const COLORS={A:'#FFE680',B:'#FFB3C7',C:'#A8E6CF',D:'#A8D8FF',E:'#D7B8FF',F:'#FFC999',G:'#C5E86C',H:'#FFA8A0'};
const MODULES=[22,23,24,25,26,27];
const MAXLEN=150,MINLEN=5,MAXANS=300,IDLE_MS=300000,RATE_MS=20000;
const BACKEND='https://question-board.amitkaliden-qb.workers.dev';
const WSB=BACKEND.replace(/^http/,'ws');
const CFG={google:'',turnstile:''};
const MODTITLE={}; // Amit fills these in Settings

/* =====================================================================
   NETWORK  (Cloudflare Worker: all rules are checked there, this page only shows results)
   ===================================================================== */
const store={get(){try{return sessionStorage.getItem('qb_s')||'';}catch(e){return '';}},set(v){try{v?sessionStorage.setItem('qb_s',v):sessionStorage.removeItem('qb_s');}catch(e){}}};
async function api(path,body){
  try{
    const r=await fetch(BACKEND+path,{method:body?'POST':'GET',headers:Object.assign({'content-type':'application/json'},S.session?{Authorization:'Bearer '+S.session}:{}),body:body?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));j.status=r.status;return j;
  }catch(e){return {ok:false,status:0,msg:'No connection. Check the WiFi and try again.'};}
}
const SOCK={};
function wsOpen(c){const s=SOCK[c];return !!(s&&s.ws&&s.ws.readyState===1);}
function setNet(){
  const want=S.role==='teacher'?CLASSES:(S.role==='student'&&S.user?[S.user.cls]:[]);
  const bad=!S.asleep&&want.length&&want.some(c=>!wsOpen(c));
  const n=$('#net');if(n){n.textContent='Reconnecting...';n.classList.toggle('on',!!bad);}
}
function openSock(c){
  const s=SOCK[c]||(SOCK[c]={ws:null,tries:0,t:null,hb:null,pong:0,live:true});
  s.live=true;let ws;
  try{ws=new WebSocket(WSB+'/ws/'+c);}catch(e){retry(c);return;}
  s.ws=ws;
  ws.onopen=()=>{
    ws.send(JSON.stringify({t:'auth',s:S.session}));s.tries=0;s.pong=Date.now();
    clearInterval(s.hb);
    s.hb=setInterval(()=>{if(ws.readyState!==1)return;if(Date.now()-s.pong>45000){try{ws.close();}catch(e){}return;}try{ws.send('ping');}catch(e){}},20000);
    setNet();
  };
  ws.onmessage=ev=>{
    if(ev.data==='pong'){s.pong=Date.now();return;}
    let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    onMsg(c,m);
  };
  ws.onclose=ev=>{
    clearInterval(s.hb);if(s.ws!==ws)return;s.ws=null;setNet();
    if(ev.code===4401){onAuthLost();return;}
    if(ev.code===4402){onReset();return;}
    if(s.live&&!S.asleep)retry(c);
  };
  ws.onerror=()=>{};
}
function retry(c){
  const s=SOCK[c];if(!s||!s.live)return;
  s.tries++;clearTimeout(s.t);
  s.t=setTimeout(()=>{if(s.live&&!S.asleep)openSock(c);},Math.min(15000,800*Math.pow(2,Math.min(s.tries,5))));
}
function closeAll(){
  Object.keys(SOCK).forEach(c=>{const s=SOCK[c];s.live=false;clearTimeout(s.t);clearInterval(s.hb);if(s.ws){const w=s.ws;s.ws=null;try{w.close();}catch(e){}}});
  setNet();
}
function connectAll(){
  closeAll();
  const list=S.role==='teacher'?CLASSES:[S.user.cls];
  list.forEach(openSock);
}
function sched(){
  if(S._r)return;
  S._r=requestAnimationFrame(()=>{S._r=0;if(S.role==='student'||S.role==='teacher')refresh();});
}
function dropClass(c){[...S.posts.keys()].forEach(k=>{if(S.posts.get(k).cls===c)S.posts.delete(k);});}
function onMsg(c,m){
  if(m.t==='init'){dropClass(c);m.posts.forEach(p=>S.posts.set(c+p.n,Object.assign({},p,{id:c+p.n,cls:c})));sched();}
  else if(m.t==='upsert'){const p=m.post;S.posts.set(c+p.n,Object.assign({},p,{id:c+p.n,cls:c}));sched();}
  else if(m.t==='remove'){S.posts.delete(c+m.n);sched();}
  else if(m.t==='clear'){dropClass(c);sched();}
  else if(m.t==='res'){onRes(m);}
}
function onAuthLost(){signOut('Please sign in again.');}
function onReset(){closeAll();S.user=null;S.role='setup';S.pick=null;S.err='';S.posts.clear();renderShell();toast('Your teacher reset your setup. Do it again.');}
async function loadConfig(){
  const r=await api('/api/config');
  if(r&&r.google!==undefined){CFG.google=r.google;CFG.turnstile=r.turnstile;Object.keys(MODTITLE).forEach(k=>delete MODTITLE[k]);Object.assign(MODTITLE,r.titles||{});}
  return r;
}
async function loadUsers(){const r=await api('/api/users');if(r.ok){S.users=r.users;if(S.role==='teacher'&&S.tab==='set')refresh(true);}}
function tsend(key,type,extra){
  const p=S.posts.get(key);if(!p)return;
  const s=SOCK[p.cls];if(!s||!s.ws||s.ws.readyState!==1){toast('Not connected. Try again in a moment.');return;}
  s.ws.send(JSON.stringify(Object.assign({t:type,n:p.n},extra||{})));
}

/* sign in */
function loadScript(src){
  return new Promise(res=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s);});
}
async function initGoogle(){
  const el=$('#gbtn');if(!el)return;
  if(!CFG.google){el.innerHTML='<p class="err">Sign-in is not ready. Reload the page.</p>';return;}
  if(!(window.google&&google.accounts)){const ok=await loadScript('https://accounts.google.com/gsi/client');if(!ok||!window.google){const e=$('#gbtn');if(e)e.innerHTML='<p class="err">Google sign-in did not load. Check the WiFi and reload.</p>';return;}}
  const e2=$('#gbtn');if(!e2)return;
  google.accounts.id.initialize({client_id:CFG.google,callback:r=>afterLogin(r.credential),auto_select:false});
  google.accounts.id.renderButton(e2,{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',width:280});
}
function loginMsg(t){const e=$('#lmsg');if(e)e.textContent=t;}
async function afterLogin(idToken){
  loginMsg('Signing in...');
  const r=await api('/api/login',{idToken});
  if(!r.ok){loginMsg(r.msg||'Sign-in failed. Try again.');return;}
  S.session=r.session;store.set(r.session);enter(r);
}
function enter(r){
  S.email=r.email;
  if(r.role==='t'){S.role='teacher';S.tab='big';S.user=null;renderShell();connectAll();return;}
  if(r.profile){S.user=r.profile;S.role='student';S.module=22;renderShell();connectAll();}
  else{S.user=null;S.role='setup';S.pick=null;S.err='';renderShell();}
}
function signOut(msg){
  closeAll();S.session='';store.set('');S.user=null;S.role='login';S.posts.clear();S.users=[];
  try{if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();}catch(e){}
  renderShell();if(msg)toast(msg);
}
async function initTs(){
  const el=$('#ts');if(!el||!CFG.turnstile)return;
  if(!window.turnstile){const ok=await loadScript('https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit');if(!ok)return;}
  const e2=$('#ts');if(!e2||!window.turnstile)return;
  try{turnstile.render(e2,{sitekey:CFG.turnstile,theme:'dark',callback:t=>{S.tsToken=t;},'expired-callback':()=>{S.tsToken='';}});}catch(e){}
}

/* =====================================================================
   STATE + HELPERS
   ===================================================================== */
const S={session:store.get(),email:'',posts:new Map(),users:[],seen:new Set(),tsToken:'',role:'login',user:null,module:22,tab:'big',cf:new Set(CLASSES),mf:'all',asleep:false,pick:null,err:'',msg:'',msgc:'',lastAct:Date.now()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PL=()=>[...S.posts.values()];
const rot=n=>(((n*37)%7)-3)*0.7;
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600);}
function modTab(m){return '<button class="tab" role="tab" aria-selected="'+(S.module===m)+'" data-act="mod" data-v="'+m+'">M'+m+(MODTITLE[m]?'<small>'+esc(MODTITLE[m])+'</small>':'')+'</button>';}

/* brick wall + street tags */
(function wall(){
  let seedv=7;const rnd=()=>{seedv=(seedv*16807)%2147483647;return seedv/2147483647;};
  const cols=['#2a0f6b','#32137a','#240c5e','#3a1590','#1c0a52','#2d0d70'];
  let r='<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120">';
  r+='<rect width="240" height="120" fill="#0a0230"/>';
  for(let row=0;row<4;row++){
    const off=row%2?30:0;
    for(let c=-1;c<5;c++){
      const x=c*60+off;
      r+='<rect x="'+(x+1.5)+'" y="'+(row*30+1.5)+'" width="57" height="27" rx="2" fill="'+cols[Math.floor(rnd()*cols.length)]+'"/>';
      r+='<rect x="'+(x+1.5)+'" y="'+(row*30+1.5)+'" width="57" height="2" fill="rgba(255,255,255,.07)"/>';
    }
  }
  r+='</svg>';
  document.documentElement.style.setProperty('--brick','url("data:image/svg+xml,'+encodeURIComponent(r)+'")');
  const words=[['HEART','#e929fb',120,22,78,-6],['ASK!','#29b6ff',420,60,86,4],['WHY?','#ff2d8a',760,18,70,-4],['37°C','#ffffff',1000,64,64,5],
               ['BLOOD','#29b6ff',1240,24,84,-5]];
  let h='';
  for(let k=0;k<2;k++){
    const o=k*1400;
    words.forEach(w=>{h+='<span class="tag" style="left:'+(w[2]+o)+'px;top:'+w[3]+'%;font-size:'+w[4]+'px;color:'+w[1]+';transform:rotate('+w[5]+'deg)">'+w[0]+'</span>';});
    h+='<span class="glow" style="left:'+(300+o)+'px;top:10%;width:220px;height:90px;background:#ff2d8a;opacity:.55"></span>';
    h+='<span class="glow" style="left:'+(880+o)+'px;top:70%;width:260px;height:100px;background:#29b6ff;opacity:.5"></span>';
    h+='<span class="glow" style="left:'+(1180+o)+'px;top:38%;width:200px;height:80px;background:#e929fb;opacity:.45"></span>';
  }
  $('#near').innerHTML=h;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.body.classList.add('still');
})();

/* =====================================================================
   VIEWS
   ===================================================================== */
function hdr(mid){
  const motion=document.body.classList.contains('still');
  return '<header class="hdr"><div class="logo">QUESTION BOARD<small>Unit 6</small></div>'+(mid||'')+
   '<div class="who"><button class="btn sm" data-act="motion" aria-pressed="'+!motion+'" title="Moving wall on or off">Wall: '+(motion?'still':'moving')+'</button>'+
   (S.role==='student'?'<button class="btn sm" data-act="pdf">Save my board (PDF)</button>':'')+
   (S.role==='student'||S.role==='teacher'||S.role==='setup'?'<button class="btn sm" data-act="signout">Sign out</button>':'')+
   '</div></header>';
}
function loginHTML(){
  return hdr()+'<div class="center"><div class="card"><h1>Ask it. Post it.</h1><p>The Unit 6 class wall. Post your questions about the human body.</p>'+
   '<div id="gbtn" style="display:flex;justify-content:center;min-height:44px"></div><p class="err" id="lmsg" role="status"></p>'+
   '<p class="fine" style="margin-top:12px">First time: you pick your class and type your name and ID. After that you go straight to your board.</p>'+
   '<p class="fine">Use your school Google account.</p></div></div>';
}
function setupHTML(){
  return hdr()+'<div class="center"><div class="card"><h2>Set up (first time only)</h2>'+
   '<span class="fld">1. Your class</span><div class="clsrow" role="group" aria-label="Class">'+
   CLASSES.map(c=>'<button class="clsb" style="--c:'+COLORS[c]+'" aria-pressed="'+(S.pick===c)+'" data-act="pickCls" data-v="'+c+'">10'+c+'</button>').join('')+'</div>'+
   '<label class="fld" for="fn">2. Your first name</label><input class="inp" id="fn" maxlength="20" autocomplete="off" autocapitalize="words">'+
   '<label class="fld" for="sid">3. Your student ID</label><input class="inp" id="sid" maxlength="12" autocomplete="off" inputmode="numeric">'+
   '<div id="ts" style="margin:10px 0;min-height:4px"></div><p class="err" id="err" role="alert">'+esc(S.err)+'</p>'+
   '<button class="btn pri" style="width:100%;min-height:56px;font-family:var(--mark);font-size:22px" data-act="start">Start</button>'+
   '<p class="fine" style="margin-top:10px">Check it carefully. Your class, name and ID show on your post-its. If something is wrong, ask your teacher.</p></div></div>';
}
function studentHTML(){
  const u=S.user;
  return hdr('<span class="chip" style="--c:'+COLORS[u.cls]+'"><b>10'+u.cls+'</b> '+esc(u.name)+'</span>')+
   '<nav class="tabs" role="tablist" aria-label="Modules">'+MODULES.map(modTab).join('')+'</nav>'+
   '<main class="main" id="main"><div class="grid" id="grid"></div></main>'+
   '<div class="compose"><div class="crow"><textarea id="qtext" rows="2" maxlength="'+MAXLEN+'" placeholder="Type your question for M'+S.module+'..." aria-label="Your question"></textarea>'+
   '<button class="btn pri" data-act="post" id="pbtn" disabled>Post</button></div>'+
   '<div class="cmeta"><span class="msg" id="msg" role="status"></span><span id="cnt">0 / '+MAXLEN+'</span></div></div>';
}
function teacherHTML(){
  return hdr('<span class="chip">Teacher view</span>')+
   '<nav class="tabs" role="tablist"><button class="tab" role="tab" data-act="tabT" data-v="big" id="t-big">Big Board</button>'+
   '<button class="tab" role="tab" data-act="tabT" data-v="flag" id="t-flag">Flagged<span class="badge" id="fbadge">0</span></button>'+
   '<button class="tab" role="tab" data-act="tabT" data-v="set" id="t-set">Settings</button></nav>'+
   '<div id="tfilters"></div><main class="main" id="tbody"></main>';
}
function postHTML(p,mode){
  const mine=!!p.mine;
  let acts='';
  const rep=(mode==='student'&&!mine)?'<button class="rep" data-act="report" data-id="'+p.id+'" aria-label="Report this post">Report</button>':'';
  const tm=mode==='teacher'?' tmenu" data-act="open" data-id="'+p.id+'" tabindex="0" role="button" aria-label="Open actions for this post':'';
  return '<article class="pn'+tm+'" style="--c:'+COLORS[p.cls]+';--r:'+rot(p.n)+'deg"><span class="tape"></span><b class="cls">10'+p.cls+'</b>'+
   '<p class="q">'+esc(p.text)+'</p>'+(p.answer?'<div class="ans"><b>Teacher answer</b>'+esc(p.answer)+'</div>':'')+
   '<footer><span>'+esc(p.name)+' · '+esc(p.sid)+(mine?'<em class="mine">You</em>':'')+'</span>'+rep+'</footer>'+acts+'</article>';
}
function ghostHTML(p){
  const rej=p.status==='rejected';
  return '<article class="pn ghost"><b class="cls">10'+p.cls+'</b><p class="q">'+esc(p.text)+'</p>'+
   '<p class="note">'+(rej?'Not posted. Your teacher said no. Try a different question.':'Waiting. Your teacher is checking this one.')+'</p>'+
   (rej?'<button class="btn sm" data-act="dismiss" data-id="'+p.id+'">OK</button>':'')+'</article>';
}
function studentGrid(){
  const u=S.user;
  const live=PL().filter(p=>p.module===S.module&&p.status==='live').sort((a,b)=>b.ts-a.ts);
  const ghost=PL().filter(p=>p.mine&&p.module===S.module&&(p.status==='held'||(p.status==='rejected'&&!S.seen.has(p.id))));
  if(!live.length&&!ghost.length)return '<div class="empty" style="grid-column:1/-1"><h3>Be first!</h3>No questions yet on M'+S.module+'. Type yours below.</div>';
  return ghost.map(ghostHTML).join('')+live.map(p=>postHTML(p,'student')).join('');
}
function teacherFilters(){
  if(S.tab==='set'||S.tab==='flag')return '';
  return '<div class="filters"><span class="fl">Classes</span>'+CLASSES.map(c=>'<button class="fchip" style="--c:'+COLORS[c]+'" aria-pressed="'+S.cf.has(c)+'" data-act="cf" data-v="'+c+'">10'+c+'</button>').join('')+
   '<span class="fl" style="margin-left:10px">Module</span><button class="fchip" style="--c:#29b6ff" aria-pressed="'+(S.mf==='all')+'" data-act="mf" data-v="all">All</button>'+
   MODULES.map(m=>'<button class="fchip" style="--c:#29b6ff" aria-pressed="'+(S.mf===m)+'" data-act="mf" data-v="'+m+'">M'+m+'</button>').join('')+'</div>';
}
function flagCard(p,hidden){
  const rs=p.reasons.map(r=>'<span class="reason">'+esc(r)+'</span>').join('');
  const btns=hidden?'<button class="btn ok" data-act="approve" data-id="'+p.id+'">Restore</button><button class="btn no" data-act="del" data-id="'+p.id+'">Delete</button>':
    '<button class="btn ok" data-act="approve" data-id="'+p.id+'">Approve</button><button class="btn no" data-act="reject" data-id="'+p.id+'">Reject</button>';
  return '<div class="fcard"><div class="body">'+(hidden?'':rs)+'<p class="qt">'+esc(p.text)+'</p><div class="meta">10'+p.cls+' · '+esc(p.name)+' · ID '+esc(p.sid)+' · M'+p.module+' · '+esc(p.email)+' · '+p.dev+' · '+hhmm(p.ts)+'</div></div><div class="btns">'+btns+'</div></div>';
}
function teacherBody(){
  if(S.tab==='big'){
    const list=PL().filter(p=>p.status==='live'&&S.cf.has(p.cls)&&(S.mf==='all'||p.module===S.mf)).sort((a,b)=>b.ts-a.ts);
    return list.length?'<div class="grid dense">'+list.map(p=>postHTML(p,'teacher')).join('')+'</div>':'<div class="empty"><h3>Nothing here yet</h3>No live questions for this filter.</div>';
  }
  if(S.tab==='flag'){
    const held=PL().filter(p=>p.status==='held').sort((a,b)=>a.ts-b.ts);
    const hid=PL().filter(p=>p.status==='hidden');
    return '<div class="flist">'+(held.length?held.map(p=>flagCard(p,false)).join(''):'<div class="empty"><h3>All clear</h3>No flagged posts waiting.</div>')+'</div>'+
      (hid.length?'<div class="sect" style="margin-top:20px"><h3>Hidden by you</h3><div class="flist">'+hid.map(p=>flagCard(p,true)).join('')+'</div></div>':'');
  }
  const users=S.users;
  const live=PL().filter(p=>p.status==='live').length;
  return '<div class="sect"><div class="stat"><div><b>'+live+'</b>live posts</div><div><b>'+PL().filter(p=>p.status==='held').length+'</b>flagged</div><div><b>'+users.length+'</b>students signed up</div></div></div>'+
   '<div class="sect"><h3>Module names</h3><p class="fine">Optional. A short name shows under each tab.</p>'+MODULES.map(m=>'<div class="srow"><label for="mt'+m+'">M'+m+'</label><input class="inp" id="mt'+m+'" data-mod="'+m+'" maxlength="24" value="'+esc(MODTITLE[m]||'')+'"></div>').join('')+'</div>'+
   '<div class="sect"><h3>Students</h3><p class="fine">Reset sends a student back to the first-time setup (for a wrong name or ID). Their old posts stay.</p>'+
   (users.length?users.map(u=>'<div class="urow"><span>10'+u.cls+' · '+esc(u.name)+' · ID '+esc(u.sid)+' · '+esc(u.email)+'</span><button class="btn sm" data-act="resetUser" data-id="'+esc(u.sub)+'">Reset</button></div>').join(''):'<p class="fine">No students yet.</p>')+'</div>'+
   '<div class="sect"><h3>End of unit</h3><p class="fine">Export first, then clear.</p><div class="srow"><button class="btn pri" data-act="exportCsv">Export all posts (CSV for a Sheet)</button><button class="btn no" data-act="clearAll">Clear all posts</button></div></div>';
}

/* =====================================================================
   RENDER
   ===================================================================== */
function renderShell(){
  const keep=$('#qtext')?$('#qtext').value:'';
  const app=$('#app');
  app.innerHTML=S.role==='login'?loginHTML():S.role==='setup'?setupHTML():S.role==='student'?studentHTML():teacherHTML();
  if(S.role==='student'){const q=$('#qtext');q.value=keep;upd();}
  refresh(true);setNet();
  if(S.role==='login')initGoogle();
  if(S.role==='setup')initTs();
}
function refresh(force){
  if(S.role==='student'){$('#grid').innerHTML=studentGrid();}
  if(S.role==='teacher'){
    const held=PL().filter(p=>p.status==='held').length;
    $('#fbadge').textContent=held;$('#fbadge').style.display=held?'inline-block':'none';
    ['big','flag','set'].forEach(k=>$('#t-'+k).setAttribute('aria-selected',S.tab===k));
    const a=document.activeElement;
    if(!force&&S.tab==='set'&&a&&a.closest&&a.closest('#tbody'))return;
    $('#tfilters').innerHTML=teacherFilters();
    $('#tbody').innerHTML=teacherBody();
  }
  const m=$('#msg');if(m){m.textContent=S.msg;m.className='msg '+S.msgc;}
}
function upd(){
  const q=$('#qtext');if(!q)return;
  const n=q.value.replace(/\s+/g,' ').trim().length;
  $('#cnt').textContent=q.value.length+' / '+MAXLEN;
  $('#pbtn').disabled=n<MINLEN;
}
function setMsg(t,c){S.msg=t;S.msgc=c||'';const m=$('#msg');if(m){m.textContent=t;m.className='msg '+(c||'');}}

/* modal */
function modal(title,bodyHTML,okLabel,onOk,danger){
  $('#mbox').innerHTML='<h3>'+esc(title)+'</h3>'+bodyHTML+'<div class="row"><button class="btn" data-act="mcancel">Cancel</button><button class="btn '+(danger?'no':'pri')+'" data-act="mok">'+esc(okLabel)+'</button></div>';
  $('#modal').classList.add('on');modal.ok=onOk;
  const i=$('#mbox input,#mbox textarea');if(i)i.focus();
}
const closeModal=()=>$('#modal').classList.remove('on');

/* print sheet (PDF through the browser's Save as PDF) */
function buildPrint(){
  const u=S.user;const mine=PL().filter(p=>p.mine&&p.status==='live');
  let h='<h1>My Question Board: Unit 6</h1><div>Class 10'+u.cls+' · '+esc(u.name)+' · ID '+esc(u.sid)+'</div>';
  const mods=[...new Set(mine.map(p=>p.module))].sort();
  if(!mods.length)h+='<p>No posted questions yet.</p>';
  mods.forEach(m=>{h+='<h2>Module '+m+(MODTITLE[m]?' · '+esc(MODTITLE[m]):'')+'</h2>';
    mine.filter(p=>p.module===m).forEach(p=>{h+='<div class="pi" style="--c:'+COLORS[p.cls]+'">'+esc(p.text)+(p.answer?'<div class="pa">Teacher answer: '+esc(p.answer)+'</div>':'')+'</div>';});});
  $('#print').innerHTML=h;
}
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
function exportCsv(){
    const rows=[['Class','Module','First name','Student ID','Google email','Question','Status','Teacher answer','Time']];
  PL().forEach(p=>rows.push(['10'+p.cls,'M'+p.module,p.name,p.sid,p.email,p.text,p.status,p.answer,new Date(p.ts).toISOString()]));
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='question-board-unit6.csv';document.body.appendChild(a);a.click();a.remove();toast('Exported '+PL().length+' posts');}
  catch(e){toast('Export did not work here. Try on the real page.');}
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case 'pickCls':S.pick=v;document.querySelectorAll('.clsb').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));break;
    case 'start':{
      const name=$('#fn').value.trim(),sid=$('#sid').value.trim();
      let err='';
      if(!S.pick)err='Pick your class.';
      else if(!/^[A-Za-z][A-Za-z\-' ]{0,19}$/.test(name))err='Type your first name in English letters.';
      else if(!/^[A-Za-z0-9]{3,12}$/.test(sid))err='Type your student ID (3 to 12 letters or numbers).';
      else if(CFG.turnstile&&!S.tsToken)err='Wait for the check mark above, then tap Start.';
      if(err){S.err=err;$('#err').textContent=err;break;}
      el.disabled=true;
      const r=await api('/api/profile',{cls:S.pick,name,sid,ts:S.tsToken});
      el.disabled=false;
      if(r.status===401){signOut('Please sign in again.');break;}
      if(!r.ok){S.err=r.msg||'Something went wrong. Try again.';const x=$('#err');if(x)x.textContent=S.err;try{if(window.turnstile)turnstile.reset();}catch(e2){}S.tsToken='';break;}
      S.user=r.profile;S.role='student';S.module=22;setMsg('');renderShell();connectAll();break;
    }
    case 'signout':signOut();break;
    case 'mod':S.module=+v;setMsg('');renderShell();break;
    case 'post':doPost();break;
    case 'report':
      modal('Report this post?','<p>It will be hidden right now and your teacher will check it.</p>','Report',()=>{tsend(id,'report');toast('Thanks. The post is hidden.');},true);break;
    case 'dismiss':S.seen.add(id);refresh();break;
    case 'tabT':S.tab=v;refresh(true);if(v==='set')loadUsers();break;
    case 'cf':S.cf.has(v)?S.cf.delete(v):S.cf.add(v);refresh(true);break;
    case 'mf':S.mf=v==='all'?'all':+v;refresh(true);break;
    case 'approve':tsend(id,'approve');break;
    case 'reject':tsend(id,'reject');break;
    case 'hide':closeModal();tsend(id,'hide');break;
    case 'open':{const p=S.posts.get(id);if(!p)break;
      $('#mbox').innerHTML='<h3>10'+p.cls+' · '+esc(p.name)+'</h3><p style="margin:0 0 4px">'+esc(p.text)+'</p><div class="mact"><button class="btn pri" data-act="answer" data-id="'+id+'">'+(p.answer?'Edit answer':'Answer')+'</button><button class="btn" data-act="hide" data-id="'+id+'">Hide</button><button class="btn no" data-act="del" data-id="'+id+'">Delete</button><button class="btn" data-act="mcancel">Close</button></div>';
      $('#modal').classList.add('on');break;}
    case 'del':modal('Delete this post?','<p>This cannot be undone.</p>','Delete',()=>tsend(id,'del'),true);break;
    case 'answer':{const p=S.posts.get(id);if(!p)break;
      modal('Answer this question','<p class="fine" style="color:#cfc4ff">'+esc(p.text)+'</p><textarea class="inp" id="ans" rows="4" maxlength="'+MAXANS+'">'+esc(p.answer)+'</textarea>','Save answer',()=>tsend(id,'answer',{text:$('#ans').value}));break;}
    case 'resetUser':{const r=await api('/api/reset',{sub:id});toast(r.ok?'Reset. The student does setup again.':(r.msg||'Could not reset.'));loadUsers();break;}
    case 'exportCsv':exportCsv();break;
    case 'clearAll':modal('Clear all posts?','<p>Export first. Type <b>CLEAR</b> to confirm.</p><input class="inp" id="cf" autocomplete="off">','Clear all',()=>{if($('#cf').value.trim()==='CLEAR'){CLASSES.forEach(c=>{const s=SOCK[c];if(s&&s.ws&&s.ws.readyState===1)s.ws.send(JSON.stringify({t:'clear'}));});toast('Cleared');}else toast('Not cleared. Type CLEAR.');},true);break;
    case 'mok':{const f=modal.ok;closeModal();if(f)f();break;}
    case 'mcancel':closeModal();break;
    case 'motion':document.body.classList.toggle('still');renderShell();break;
    case 'pdf':buildPrint();try{window.print();}catch(err){toast('Open the page in Safari to save a PDF.');}break;
    case 'wake':document.body.classList.remove('asleep');S.asleep=false;S.lastAct=Date.now();if(S.role==='student'||S.role==='teacher'){loadConfig().then(()=>refresh(true));connectAll();}refresh(true);break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='qtext')upd();
  if(e.target.dataset&&e.target.dataset.mod){
    MODTITLE[e.target.dataset.mod]=e.target.value.trim();
    clearTimeout(S.tt);S.tt=setTimeout(()=>{const t={};MODULES.forEach(m=>{t[m]=MODTITLE[m]||'';});api('/api/config',{titles:t});},700);
  }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tmenu')){e.preventDefault();e.target.click();}
  if(e.target.id==='qtext'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!$('#pbtn').disabled)doPost();}
  if(e.key==='Escape')closeModal();
});
function doPost(){
  const q=$('#qtext');
  if(!wsOpen(S.user.cls)){setMsg('Not connected yet. Wait a moment and try again.','bad');return;}
  $('#pbtn').disabled=true;
  SOCK[S.user.cls].ws.send(JSON.stringify({t:'post',module:S.module,text:q.value}));
}
function onRes(m){
  upd();
  if(!m.ok){setMsg(m.msg,'bad');return;}
  const q=$('#qtext');if(q){q.value='';upd();}
  setMsg(m.status==='live'?'Posted! Everyone in your class can see it.':'Sent. Your teacher must check this one first.','good');
}

/* idle sleep (5 minutes with no touch) */
function sleepNow(){S.asleep=true;closeAll();document.body.classList.add('asleep');}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{S.lastAct=Date.now();},{passive:true}));
setInterval(()=>{if(!S.asleep&&S.role!=='login'&&Date.now()-S.lastAct>IDLE_MS)sleepNow();},5000);

(async function boot(){
  await loadConfig();
  if(S.session){
    const r=await api('/api/me',{});
    if(r.ok){enter(r);return;}
    S.session='';store.set('');
  }
  renderShell();
})();

})();
</script>
